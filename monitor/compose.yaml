services:
  monitor:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      AUTO_PROBES: "true"
      MIN_RANK_DAYS: "3"
      CALL_TIMEOUT: "90"
    volumes:
      - monitor-data:/data
      - ./secrets/accounts.env:/run/secrets/accounts.env:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/healthz',timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
volumes:
  monitor-data:
